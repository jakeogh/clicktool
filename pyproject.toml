[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clicktool"
version = "1!0.0.1787109868"
description = "Common functions for @click"
authors = [
    { name = "Justin Keogh", email = "github.com@v6y.net" },
]
dependencies = [
    "click",
    "globalverbose @ git+https://github.com/jakeogh/globalverbose@59abc758c18c0b85e9e61c1e14e5a64a81bb220e",
    "icecream @ git+https://github.com/jakeogh/icecream@34864a6bade1b63d0f7bb0a2e8acc42f8b258282",
    "portagetool @ git+https://github.com/jakeogh/portagetool@d0b54ddb2218fce1301368e4affef8ca4b6d337e",
]
license = "ISC"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/jakeogh/clicktool"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
clicktool = [
    "py.typed",
]

